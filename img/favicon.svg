<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- pozadí: čtverec se zaoblenými rohy -->
  <rect width="100" height="100" rx="18" fill="#861b24"/>

  <!-- levé křídlo (pravé je jeho zrcadlový obraz) -->
  <path id="kridlo" fill="#1b1a19"
        d="M 30 46
           C 23 33, 13 24, 3 24
           C 7 34, 8 48, 5 60
           Q 14 53, 21.5 66.5
           Q 24 58, 30 58 Z"/>
  <use href="#kridlo" transform="translate(100 0) scale(-1 1)"/>

  <!-- bílé klávesy -->
  <rect x="28.5" y="27" width="13" height="46" rx="2" fill="#f8f6f2"/>
  <rect x="43.5" y="27" width="13" height="46" rx="2" fill="#f8f6f2"/>
  <rect x="58.5" y="27" width="13" height="46" rx="2" fill="#f8f6f2"/>

  <!-- černé klávesy -->
  <rect x="37.5" y="27" width="8" height="28" rx="1.5" fill="#1b1a19"/>
  <rect x="54.5" y="27" width="8" height="28" rx="1.5" fill="#1b1a19"/>

  <!-- zlatý kříž -->
  <rect x="48.3" y="10" width="3.4" height="13" fill="#d4af37"/>
  <rect x="43.5" y="15" width="13" height="3.4" fill="#d4af37"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
